server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the RAG service upload limit. Nginx defaults to 1MB otherwise.
    client_max_body_size 100m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Real IP forwarding (when behind reverse proxy like Nginx, HAProxy, etc.)
    # Trusted proxy addresses - adjust these based on your infrastructure
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    # Use X-Forwarded-For header to get real client IP
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Common security headers are defined at server scope.
    }

    # Isolated WorkTool media test. Strip prefix before forwarding HMAC requests.
    location ^~ /wt-test/ {
        # Resolve at request time so the web container can start even when the
        # optional isolated test network is not attached after a recreate.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $wt_test_upstream worktool-gateway-isolated-media-test;
        rewrite ^/wt-test/(.*)$ /$1 break;
        proxy_pass http://$wt_test_upstream:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API reverse proxy -> tgo-api (剥掉 /api 前缀, tgo-api 路由是 /v1/...)
    location /api/ {
        proxy_pass http://tgo-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Runtime configuration changes whenever the container is recreated.
    # It must be revalidated instead of sharing the one-year JS asset cache.
    location = /env-config.js {
        expires -1;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        # `expires` emits Cache-Control while preserving server security headers.
        try_files $uri =404;
    }

    # Don't cache HTML files
    location ~* \.html$ {
        expires -1;
        # Do not add a location-level add_header here. Nginx would otherwise
        # stop inheriting the CSP and other security headers above.
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
